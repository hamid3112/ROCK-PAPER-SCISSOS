<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <style>
    .emoji { font-size: 45px; text-anchor: middle; dominant-baseline: middle; }
    .pulse {
      animation: pulseAnim 3s infinite ease-in-out;
      transform-origin: center;
    }
    .rock-anim { animation-delay: 0s; }
    .paper-anim { animation-delay: 1s; }
    .scissor-anim { animation-delay: 2s; }
    
    @keyframes pulseAnim {
      0%, 100% { transform: scale(1); filter: drop-shadow(0px 0px 2px rgba(0,0,0,0.1)); }
      50% { transform: scale(1.15); filter: drop-shadow(0px 10px 20px rgba(99, 102, 241, 0.4)); }
    }
    .vs-text {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 800;
      fill: #ff4757;
      font-size: 28px;
      text-anchor: middle;
      dominant-baseline: middle;
      animation: flash 1.5s infinite alternate;
    }
    @keyframes flash {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
  
  <rect width="100%" height="100%" rx="15" fill="#0f172a" />
  
  <g class="pulse rock-anim" transform="translate(150, 100)">
    <circle r="50" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <text class="emoji">🪨</text>
  </g>
  
  <g class="pulse paper-anim" transform="translate(300, 100)">
    <circle r="50" fill="#1e293b" stroke="#a78bfa" stroke-width="3" />
    <text class="emoji">📄</text>
  </g>
  
  <g class="pulse scissor-anim" transform="translate(450, 100)">
    <circle r="50" fill="#1e293b" stroke="#f43f5e" stroke-width="3" />
    <text class="emoji">✂️</text>
  </g>
  
  <g transform="translate(650, 100)">
    <circle r="50" fill="#1e293b" stroke="#34d399" stroke-width="3" />
    <text class="emoji" y="-5">💻</text>
    <text font-family="sans-serif" font-size="12" fill="#34d399" y="30" text-anchor="middle" font-weight="bold">AI BOT</text>
  </g>
  
  <text x="550" y="105" class="vs-text">VS</text>
</svg>
